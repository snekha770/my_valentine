<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Snekha ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffe4e1;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        #card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        img {
            width: 250px;
            height: auto;
            border-radius: 15px;
        }
        h1 { color: #ff4d6d; font-size: 1.8rem; margin: 20px 0; }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            height: 50px; /* Prevents layout jump */
        }
        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #adb5bd; color: white; position: absolute; }
        .hidden { display: none; }
        .couple-names { color: #ff4d6d; font-size: 1.5rem; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="card">
        <div id="question-area">
            <img id="display-gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpwaGZ6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/W6LoiK6y3X1n7Bf6S4/giphy.gif" alt="Milky Mocha">
            <h1 id="main-text">Will you be my Valentine, Snekha?</h1>
            <div class="btn-container">
                <button id="yesBtn">Yes!</button>
                <button id="noBtn">No</button>
            </div>
        </div>

        <div id="happy-area" class="hidden">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpwaGZ6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/LnL6W1bM2T8m6tO6Yk/giphy.gif" alt="Happy Milky Mocha">
            <h1>Yay! I knew you'd say Yes! ❤️</h1>
            <div class="couple-names">Bala Vignnesh ❤️ Snekha</div>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const gif = document.getElementById('display-gif');
        const text = document.getElementById('main-text');
        
        // List of sad GIFs to cycle through
        const sadGifs = [
            "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpwaGZ6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/BEob50RKnWVnm/giphy.gif",
            "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpwaGZ6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/OPU6wUKARAOztu69sr/giphy.gif"
        ];

        const sadMessages = ["Are you sure?", "Think about it again!", "Bala will be sad...", "Please? :(", "Last chance!"];
        let count = 0;

        // Make the NO button run away
        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
            
            // Change text and GIF as it moves
            if (count < sadMessages.length) {
                text.innerText = sadMessages[count];
                gif.src = sadGifs[count % sadGifs.length];
                count++;
            }
        });

        // Show success screen
        yesBtn.addEventListener('click', () => {
            document.getElementById('question-area').classList.add('hidden');
            document.getElementById('happy-area').classList.remove('hidden');
        });
    </script>
</body>
</html>
