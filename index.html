<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Snekha ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffe4e1;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        #card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
            position: relative;
        }
        img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            border-radius: 15px;
        }
        h1 { color: #d63384; font-size: 1.5rem; margin: 15px 0; }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        button {
            padding: 10px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }
        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { 
            background-color: #adb5bd; 
            color: white; 
            position: absolute; 
            transition: all 0.2s ease;
        }
        .hidden { display: none; }
        .names { color: #ff4d6d; font-size: 1.2rem; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="card">
        <div id="ask">
            <img id="main-gif" src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpwaGZ6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/W6LoiK6y3X1n7Bf6S4/giphy.gif" alt="Mocha">
            <h1 id="status-text">Will you be my Valentine, Snekha?</h1>
            <div class="btn-container">
                <button id="yesBtn">Yes</button>
                <button id="noBtn" style="left: 190px; top: 295px;">No</button>
            </div>
        </div>

        <div id="success" class="hidden">
            <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpwaGZ6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6bmV6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/LnL6W1bM2T8m6tO6Yk/giphy.gif" alt="Happy">
            <h1>Yay! Happy Valentine's Day! ❤️</h1>
            <p class="names">Bala Vignnesh ❤️ Snekha</p>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const gif = document.getElementById('main-gif');
        const status = document.getElementById('status-text');

        // Sad Milky Mocha GIFs
        const sadGifs = [
            "https://media.giphy.com/media/OPU6wUKARAOztu69sr/giphy.gif",
            "https://media.giphy.com/media/BEob50RKnWVnm/giphy.gif",
            "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcnVnZndvOWt2YXU0Z2p3Z3p3Z3p3Z3p3Z3p3Z3p3Z3p3Z3AmZXA9djFfaW50ZXJuYWxfZ2lmX2J5X2lkJmN0PXM/U6Y5WqjInP6Yq0X9rS/giphy.gif"
        ];

        const messages = ["Are you sure?", "Please?", "Bala will cry...", "Don't be mean!", "Think again!"];
        let count = 0;

        // Moves the No button when hovered
        noBtn.addEventListener('mouseover', () => {
            const maxX = window.innerWidth - noBtn.offsetWidth;
            const maxY = window.innerHeight - noBtn.offsetHeight;
            
            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;

            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';

            // Change Text and GIF
            if (count < messages.length) {
                status.innerText = messages[count];
                gif.src = sadGifs[count % sadGifs.length];
                count++;
            }
        });

        yesBtn.addEventListener('click', () => {
            document.getElementById('ask').classList.add('hidden');
            document.getElementById('success').classList.remove('hidden');
        });
    </script>
</body>
</html>
