<!DOCTYPE html>
<html>
<head>
<title>For Bala 💖</title>
<style>
body{
  margin:0;
  padding:0;
  text-align:center;
  font-family: Arial, sans-serif;
  background: linear-gradient(to right,#ff758c,#ff7eb3);
  color:white;
}

.container{
  margin-top:100px;
}

button{
  padding:12px 25px;
  font-size:18px;
  margin:15px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.yes{
  background:#ff2e63;
  color:white;
}

.no{
  background:white;
  color:black;
}

img{
  margin-top:20px;
  width:250px;
  border-radius:10px;
}

</style>
</head>
<body>

<div class="container" id="content">

<h1>Babe, will you be my valentine? 💖</h1>

<button class="yes" onclick="nextPage1()">Yes 💕</button>
<button class="no" onclick="showSad()">No 😢</button>

</div>

<script>

function showSad(){
  document.getElementById("content").innerHTML = `
  <h1>You said No? 🥺</h1>
  <img src="https://media.giphy.com/media/3o6Zt481isNVuQI1l6/giphy.gif">
  <br>
  <button class="yes" onclick="nextPage2()">Maybe I should explain the perks... Okay 😌</button>
  `;
}

function nextPage1(){
  nextPage2();
}

function nextPage2(){
  document.getElementById("content").innerHTML = `
  <h1>Maybe I should explain the perks of being my valentine 💕</h1>
  <button class="yes" onclick="nextPage3()">Okay 😌</button>
  `;
}

function nextPage3(){
  document.getElementById("content").innerHTML = `
  <h1>Why you should choose me as your Valentine? 💖</h1>
  <h2>Pros 😍</h2>
  <p>• I will take care of you as my baby 🥰</p>
  <p>• Unlimited love and hugs 🤗</p>
  <p>• I will always support you 💕</p>
  <h2>Cons 😏</h2>
  <p>• Nothing 😌</p>
  <br>
  <button class="yes" onclick="finalPage()">Continue 💘</button>
  `;
}

function finalPage(){
  document.getElementById("content").innerHTML = `
  <h1>Will you be my Valentine? 💖</h1>
  <button class="yes" onclick="lovePage()">Yes 💕</button>
  `;
}

function lovePage(){
  document.getElementById("content").innerHTML = `
  <h1>Yayyyy! 💋</h1>
  <h2>Snekha ❤️ Bala Vignnesh</h2>
  <h2>Love you purusha 😘</h2>
  <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif">
  `;
}

</script>

</body>
</html>
