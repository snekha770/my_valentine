<!DOCTYPE html>
<html>
<head>
  <title>For Bala 💖</title>
  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: pink;
      overflow: hidden;
    }
    h1 {
      margin-top: 100px;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      margin: 20px;
      cursor: pointer;
    }
    #noBtn {
      position: absolute;
    }
  </style>
</head>
<body>

<h1>Will you be my Valentine Bala Vignnesh? 💖</h1>

<button onclick="yesClicked()">Yes 💕</button>
<button id="noBtn" onmouseover="moveButton()">No 😢</button>

<script>
function yesClicked() {
  document.body.innerHTML = "<h1>Yayyy! I love you Bala 💖 Forever and Always 😘</h1>";
}

function moveButton() {
  var button = document.getElementById("noBtn");
  var x = Math.random() * window.innerWidth;
  var y = Math.random() * window.innerHeight;
  button.style.left = x + "px";
  button.style.top = y + "px";
}
</script>

</body>
</html>
